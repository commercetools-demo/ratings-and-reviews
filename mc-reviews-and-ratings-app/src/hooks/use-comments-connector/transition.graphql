#import "./fragments/comment-detail.graphql"

mutation TransitionComment(
  $id: String!
  $version: Long!
  $stateId: String!
  $acceptLanguage: [Locale!]
) {
  updateReview(
    id: $id
    version: $version
    actions: [{ transitionState: { state: { typeId: "state", id: $stateId } } }]
  ) {
    ...CommentDetail
  }
}
