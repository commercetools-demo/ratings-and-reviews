query ReviewStates($acceptLanguage: [Locale!]) {
  states(where: "type = \"ReviewState\"", limit: 50, sort: ["createdAt asc"]) {
    results {
      id
      key
      initial
      name(acceptLanguage: $acceptLanguage)
    }
  }
}
